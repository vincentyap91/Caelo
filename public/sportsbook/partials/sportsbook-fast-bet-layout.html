<div class="sportsbook-layout fb-layout">
      <main class="main-content fb-main" id="main-content">
        <!-- =900: title bar (same pattern as National Team) -->
        <div class="nt-mobile-subbar" aria-label="Fast bet">
          <a href="/sportsbook" data-caelo-nav="sportsbook" class="nt-mobile-subbar__back" aria-label="Back">
            <img src="/sportsbook/mobile/assets/icons/sp-back.svg" alt="" width="10" height="16" />
          </a>
          <h1 class="nt-mobile-subbar__title">Fast bet</h1>
          <div class="nt-mobile-subbar__actions">
            <a href="/sportsbook/search" data-caelo-nav="sportsbook-search" class="nt-mobile-subbar__btn" aria-label="Search">
              <img src="/sportsbook/mobile/assets/icons/sp-search.svg" alt="" width="16" height="16" />
            </a>
            <a href="/sportsbook/favourites" data-caelo-nav="sportsbook-favourites" class="nt-mobile-subbar__btn" aria-label="Favourites">
              <img src="/sportsbook/mobile/assets/icons/sp-star.svg" alt="" width="16" height="16" />
            </a>
            <button type="button" class="nt-mobile-subbar__btn" aria-label="Filter" data-mh-mf-open data-mh-mf-variant="live" aria-haspopup="dialog" aria-controls="mh-mf" title="Filter">
              <img src="/sportsbook/mobile/assets/icons/sp-filter.svg" alt="" width="16" height="16" />
            </button>
          </div>
        </div>

        <div class="fb-toolbar">
          <nav class="fb-crumbs" aria-label="Breadcrumb">
            <a href="/sportsbook" data-caelo-nav="sportsbook" class="fb-crumb" aria-label="Home">
              <img src="/sportsbook/assets/icons/te-home.svg" alt="" width="16" height="16" />
            </a>
            <span class="fb-crumb-sep" aria-hidden="true">/</span>
            <span class="fb-crumb" aria-current="page">Fast bet</span>
          </nav>
        </div>

        <h1 class="fb-title">Fast Bet</h1>

        <section class="fb-grid" aria-label="Fast Bet games">
          <a href="#" class="fb-card" data-game="max-sports">
            <img src="/sportsbook/assets/images/fast-bet/max-sports.png" alt="Max-Sports Challenge" width="624" height="390" />
            <span class="fb-card-label">Max-Sports Challenge</span>
          </a>
          <a href="#" class="fb-card" data-game="etalon">
            <img src="/sportsbook/assets/images/fast-bet/etalon.png" alt="Etalon" width="624" height="390" />
            <span class="fb-card-label">Etalon</span>
          </a>
          <a href="#" class="fb-card" data-game="155">
            <img src="/sportsbook/assets/images/fast-bet/155.png" alt="155" width="624" height="390" />
            <span class="fb-card-label">155</span>
          </a>
        </section>
      </main>
    </div>
